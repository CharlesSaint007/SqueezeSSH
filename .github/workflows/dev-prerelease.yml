name: Dev pre-release

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-prerelease
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: 0.0.0-dev.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 secret is not set; see README 'Release signing'."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed dev APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDevRelease
          cp app/build/outputs/apk/dev/release/app-dev-release.apk \
             "squeezessh-dev-${APP_VERSION_NAME}.apk"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Dev build ${{ github.run_number }}
          prerelease: true
          body: |
            Automated dev build from `${{ github.sha }}`.
            Installs as **SqueezeSSH Dev** (`me.nick.squeezessh.dev`), side by side with stable.
          files: squeezessh-dev-*.apk

      - name: Prune old dev pre-releases (keep 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("dev-")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
          | while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done
